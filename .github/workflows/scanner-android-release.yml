name: Scanner app - Android release bundle

# Builds the signed .aab for Google Play. Run it from the Actions tab
# ("Run workflow") or by pushing to the scanner-release branch.
on:
  workflow_dispatch:
  push:
    branches: [scanner-release]
    paths:
      - 'mobile-scanner-app-flutter/app/**'
      - '.github/workflows/scanner-android-release.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-scanner-app-flutter/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "Missing signing secrets (ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS)." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      - run: flutter pub get

      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build app bundle
        run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: hexlura-scanner-aab
          path: mobile-scanner-app-flutter/app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
