<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hexlura Scanner iOS — Login</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>

<div class="nav-strip">
    <a href="login.html" class="active">1. Login</a>
    <a href="permission.html">2. Camera permission</a>
    <a href="events.html">3. Events</a>
    <a href="scanner.html">4. Scanner</a>
    <a href="attendees.html">5. Attendees</a>
</div>

<div class="device">
  <div class="screen">
    <div class="island"></div>
    <div class="statusbar"><span>9:41</span><span class="right">▂▄▆█ ᯤ 🔋</span></div>

    <div class="screen-body" style="justify-content:center;padding:0 24px;">
        <div style="text-align:center;margin-bottom:32px;">
            <div style="width:72px;height:72px;background:var(--accent);border-radius:17px;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;">
                <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9a3 3 0 0 1 0 6v3a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-3a3 3 0 0 1 0-6V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v3z"/><line x1="13" y1="5" x2="13" y2="19" stroke-dasharray="2 2"/></svg>
            </div>
            <p class="heading" style="font-size:40px;color:var(--accent);margin:0 0 4px;">HEXLURA</p>
            <p style="font-size:15px;color:var(--muted);margin:0;">Door Staff Scanner</p>
        </div>

        <form style="display:flex;flex-direction:column;gap:16px;" onsubmit="return false;">
            <div>
                <label class="label">Email</label>
                <input class="input" type="email" placeholder="you@hexlura.com" autocomplete="email">
            </div>
            <div>
                <label class="label">Password</label>
                <input class="input" type="password" placeholder="Password" autocomplete="current-password">
            </div>

            <div class="group" style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;">
                <span style="font-size:16px;">Keep me signed in</span>
                <div class="switch"></div>
            </div>

            <button class="btn" style="margin-top:6px;" onclick="window.location.href='permission.html'">Sign In</button>

            <div style="display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;">
                <div style="flex:1;height:0.5px;background:var(--border);"></div>or<div style="flex:1;height:0.5px;background:var(--border);"></div>
            </div>
            <button class="btn" style="background:#fff;color:#000;display:flex;align-items:center;justify-content:center;gap:8px;" onclick="window.location.href='permission.html'">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="#000"><path d="M16.4 12.7c0-2.5 2-3.7 2.1-3.8-1.2-1.7-3-1.9-3.6-2-1.5-.2-3 .9-3.800.9s-2-.9-3.300-.9c-1.700 0-3.300 1-4.100 2.500-1.800 3.100-.5 7.600 1.300 10.100.8 1.200 1.800 2.600 3.200 2.500 1.300-.1 1.800-.8 3.300-.8s2 .8 3.300.8 2.300-1.200 3.100-2.500c1-1.400 1.400-2.800 1.400-2.900-.1 0-2.900-1.100-2.900-4zM14 5.300c.7-.8 1.100-2 1-3.100-1 0-2.200.7-2.900 1.500-.6.700-1.200 1.900-1 3 1.100.1 2.200-.6 2.900-1.400z"/></svg>
                Sign in with Apple
            </button>
            <button class="btn btn-secondary" style="display:flex;align-items:center;justify-content:center;gap:8px;" onclick="window.location.href='permission.html'">
                <span style="font-weight:700;color:#4285F4;">G</span> Continue with Google
            </button>
        </form>

        <p style="text-align:center;margin:26px 8px 0;font-size:13px;color:var(--footnote);line-height:1.5;">
            Works offline once signed in.<br>Scans queue locally and sync when you're back online.
        </p>
    </div>
    <div class="home-indicator"></div>
  </div>
</div>

</body>
</html>
