# Machine has 7GB total RAM — the Flutter-generated default of -Xmx8G alone
# exceeds that and crashes the daemon with an OOM before the build can finish.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=false
android.useAndroidX=true
