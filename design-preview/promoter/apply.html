<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hexlura — Become a Promoter</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: { bg:'#FAF6F3', card:'#FFFFFF', border:'#F1E7E2', text:'#1A0E0C', muted:'#6B5D56', accent:'#E63950', orange:'#FF7A3D', amber:'#F5A623', yellow:'#F5C518', green:'#1B9C63', amberText:'#9C6900', yellowText:'#8C6A00' },
    fontFamily: { heading:['"Bebas Neue"','sans-serif'], sans:['"DM Sans"','sans-serif'], mono:['"JetBrains Mono"','monospace'] },
    boxShadow: { soft:'0 2px 12px rgba(60,20,10,0.05)', card:'0 6px 24px -4px rgba(60,20,10,0.08)', hover:'0 12px 36px -6px rgba(60,20,10,0.14)', glow:'0 10px 34px -6px rgba(230,57,80,0.4)' },
  } } }
</script>
<style>
  body { background: radial-gradient(1200px 500px at 90% -10%, rgba(255,122,61,0.10), transparent), radial-gradient(900px 400px at -10% 0%, rgba(230,57,80,0.07), transparent), #FAF6F3; }
  .navlink.active { background:#1A0E0C; color:#fff; box-shadow:0 6px 18px -4px rgba(26,14,12,0.35); }
  .tab.active { color:#1A0E0C; border-color:#E63950; }
  ::-webkit-scrollbar { width:8px; height:8px; } ::-webkit-scrollbar-thumb { background:#F1E7E2; border-radius:8px; }
</style>
</head>
<body class="font-sans text-text min-h-screen">
<header class="flex items-center justify-between px-6 py-4">
  <a href="#" class="font-heading text-3xl text-accent tracking-wider">HEXLURA<sup class="text-[0.4em] align-super tracking-normal">®</sup></a>
  <a href="#" class="text-sm font-semibold text-muted hover:text-text transition">My account</a>
</header>
<main class="px-6 pb-16 pt-6 flex justify-center">
  <div class="w-full max-w-md bg-card rounded-3xl border border-border shadow-card p-8 md:p-10">

    <p class="text-xs font-bold tracking-widest text-accent mb-2">PROMOTER ACCOUNT</p>
    <h1 class="font-heading text-4xl tracking-wide mb-1">BECOME A PROMOTER</h1>
    <p class="text-sm text-muted mb-7">Share event links, earn commission on every ticket you sell. Free to join.</p>
    <form class="space-y-5">
      <div><label class="text-xs font-semibold text-muted mb-1.5 block">Display name</label>
        <input type="text" placeholder="DJ Azeer" class="w-full px-3.5 py-2.5 rounded-lg bg-bg border border-border text-sm" />
        <p class="text-xs text-muted mt-1.5">Used to generate your referral code (e.g. DJAZEER).</p></div>
      <div><label class="text-xs font-semibold text-muted mb-1.5 block">Short bio <span class="font-normal">(optional)</span></label>
        <textarea rows="3" placeholder="A line about who you are and what you promote." class="w-full px-3.5 py-2.5 rounded-lg bg-bg border border-border text-sm resize-none"></textarea></div>
      <!-- Error line: only shown when something goes wrong -->
      <p class="hidden text-sm text-accent bg-accent/10 rounded-lg px-3.5 py-2.5">Something went wrong — try again.</p>
      <button type="submit" class="w-full py-3.5 rounded-full bg-accent text-white font-semibold shadow-glow hover:brightness-110 transition">Become a Promoter</button>
      <p class="text-xs text-muted text-center">By continuing you agree to the Hexlura <a href="#" class="text-accent font-semibold hover:underline">Terms of Service</a>.</p>
    </form>
  </div>
</main>
</body>
</html>
