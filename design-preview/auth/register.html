<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign Up — Hexlura</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: '#FAF6F3', card: '#FFFFFF', border: '#F1E7E2', text: '#1A0E0C',
          muted: '#6B5D56', accent: '#E63950', orange: '#FF7A3D', amber: '#F5A623',
          yellow: '#F5C518', green: '#1B9C63',
          orangeText: '#C2521A', amberText: '#9C6900', yellowText: '#8C6A00',
        },
        fontFamily: {
          heading: ['"Bebas Neue"', 'sans-serif'],
          sans: ['"DM Sans"', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'monospace'],
        },
        boxShadow: {
          soft: '0 2px 12px rgba(60,20,10,0.05)',
          card: '0 6px 24px -4px rgba(60,20,10,0.08)',
          hover: '0 12px 36px -6px rgba(60,20,10,0.14)',
          glow: '0 10px 34px -6px rgba(230,57,80,0.4)',
        },
      },
    },
  }
</script>
<style>
  body { background:
    radial-gradient(1200px 500px at 90% -10%, rgba(255,122,61,0.10), transparent),
    radial-gradient(900px 400px at -10% 0%, rgba(230,57,80,0.07), transparent),
    #FAF6F3;
  }
</style>
</head>
<body class="font-sans text-text min-h-screen flex flex-col items-center justify-center px-6 py-12">

  <a href="../public-site/home.html" class="font-heading text-3xl text-accent tracking-wider mb-8">HEXLURA<sup class="text-[0.4em] align-super tracking-normal">®</sup></a>

  <div class="w-full max-w-sm bg-card rounded-3xl border border-border shadow-card p-8">
    <h1 class="font-heading text-3xl tracking-wide mb-1">CREATE ACCOUNT</h1>
    <p class="text-sm text-muted mb-6">Join Hexlura to discover and book events.</p>

    <button class="w-full flex items-center justify-center gap-2 py-3 rounded-full border border-border text-sm font-semibold hover:bg-bg transition mb-5">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.7-2.4 3.6v3h3.9c2.3-2.1 3.5-5.2 3.5-8.8z"/><path fill="#34A853" d="M12 24c3.2 0 5.9-1 7.9-2.9l-3.9-3c-1.1.7-2.4 1.1-4 1.1-3.1 0-5.7-2.1-6.6-4.9H1.3v3.1C3.3 21.3 7.3 24 12 24z"/><path fill="#FBBC05" d="M5.4 14.3c-.2-.7-.4-1.5-.4-2.3s.1-1.6.4-2.3V6.6H1.3C.5 8.2 0 10 0 12s.5 3.8 1.3 5.4l4.1-3.1z"/><path fill="#EA4335" d="M12 4.8c1.8 0 3.3.6 4.6 1.8l3.4-3.4C17.9 1.2 15.2 0 12 0 7.3 0 3.3 2.7 1.3 6.6l4.1 3.1c.9-2.8 3.5-4.9 6.6-4.9z"/></svg>
      Continue with Google
    </button>

    <div class="flex items-center gap-3 mb-5">
      <div class="flex-1 h-px bg-border"></div>
      <span class="text-xs text-muted">or</span>
      <div class="flex-1 h-px bg-border"></div>
    </div>

    <form class="space-y-4">
      <div>
        <label class="text-xs font-semibold text-muted mb-1.5 block">Full Name</label>
        <input type="text" placeholder="Jane Smith" class="w-full px-3.5 py-2.5 rounded-lg bg-bg border border-border text-sm" />
      </div>
      <div>
        <label class="text-xs font-semibold text-muted mb-1.5 block">Email</label>
        <input type="email" placeholder="you@example.com" class="w-full px-3.5 py-2.5 rounded-lg bg-bg border border-border text-sm" />
      </div>
      <div>
        <label class="text-xs font-semibold text-muted mb-1.5 block">Password</label>
        <input type="password" placeholder="••••••••" class="w-full px-3.5 py-2.5 rounded-lg bg-bg border border-border text-sm" />
      </div>
      <div>
        <label class="text-xs font-semibold text-muted mb-1.5 block">Confirm Password</label>
        <input type="password" placeholder="••••••••" class="w-full px-3.5 py-2.5 rounded-lg bg-bg border border-border text-sm" />
      </div>

      <button type="submit" class="w-full py-3 rounded-full bg-accent text-white font-semibold shadow-glow hover:brightness-110 transition">Create Account</button>
    </form>

    <p class="text-center text-sm text-muted mt-6">Already have an account? <a href="login.html" class="text-accent font-semibold hover:underline">Log In</a></p>
  </div>

  <p class="text-xs text-muted mt-8 max-w-sm text-center">By creating an account you agree to Hexlura's <a href="../legal/terms.html" class="hover:text-accent underline">Terms</a> and <a href="../legal/privacy.html" class="hover:text-accent underline">Privacy Policy</a>.</p>

</body>
</html>
