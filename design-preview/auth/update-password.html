<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Set New Password — Hexlura</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: '#FAF6F3', card: '#FFFFFF', border: '#F1E7E2', text: '#1A0E0C',
          muted: '#6B5D56', accent: '#E63950', orange: '#FF7A3D', amber: '#F5A623',
          yellow: '#F5C518', green: '#1B9C63',
          orangeText: '#C2521A', amberText: '#9C6900', yellowText: '#8C6A00',
        },
        fontFamily: {
          heading: ['"Bebas Neue"', 'sans-serif'],
          sans: ['"DM Sans"', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'monospace'],
        },
        boxShadow: {
          soft: '0 2px 12px rgba(60,20,10,0.05)',
          card: '0 6px 24px -4px rgba(60,20,10,0.08)',
          hover: '0 12px 36px -6px rgba(60,20,10,0.14)',
          glow: '0 10px 34px -6px rgba(230,57,80,0.4)',
        },
      },
    },
  }
</script>
<style>
  body { background:
    radial-gradient(1200px 500px at 90% -10%, rgba(255,122,61,0.10), transparent),
    radial-gradient(900px 400px at -10% 0%, rgba(230,57,80,0.07), transparent),
    #FAF6F3;
  }
</style>
</head>
<body class="font-sans text-text min-h-screen flex flex-col items-center justify-center px-6 py-12">

  <a href="../public-site/home.html" class="font-heading text-3xl text-accent tracking-wider mb-8">HEXLURA<sup class="text-[0.4em] align-super tracking-normal">®</sup></a>

  <!-- STATE 1 (default, shown): valid link — new password form -->
  <div class="w-full max-w-sm bg-card rounded-3xl border border-border shadow-card p-8">
    <h1 class="font-heading text-3xl tracking-wide mb-1">SET NEW PASSWORD</h1>
    <p class="text-sm text-muted mb-6">Choose a new password for your account.</p>

    <form class="space-y-4">
      <div>
        <label class="text-xs font-semibold text-muted mb-1.5 block">New Password</label>
        <input type="password" placeholder="••••••••" class="w-full px-3.5 py-2.5 rounded-lg bg-bg border border-border text-sm" />
      </div>
      <div>
        <label class="text-xs font-semibold text-muted mb-1.5 block">Confirm New Password</label>
        <input type="password" placeholder="••••••••" class="w-full px-3.5 py-2.5 rounded-lg bg-bg border border-border text-sm" />
      </div>

      <button type="submit" class="w-full py-3 rounded-full bg-accent text-white font-semibold shadow-glow hover:brightness-110 transition">Update Password</button>
    </form>
  </div>

  <!--
  STATE 2 (reference only): expired/invalid link error

  <div class="w-full max-w-sm bg-card rounded-3xl border border-border shadow-card p-8 text-center">
    <div class="w-16 h-16 rounded-full bg-accent/10 flex items-center justify-center mx-auto mb-5">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#E63950" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
    </div>
    <h1 class="font-heading text-3xl tracking-wide mb-2">LINK EXPIRED</h1>
    <p class="text-sm text-muted mb-6">This password reset link is invalid or has expired. Please request a new one.</p>
    <a href="reset-password.html" class="block w-full py-3 rounded-full bg-accent text-white font-semibold shadow-glow hover:brightness-110 transition">Request New Link</a>
  </div>
  -->

  <!--
  STATE 3 (reference only): success

  <div class="w-full max-w-sm bg-card rounded-3xl border border-border shadow-card p-8 text-center">
    <div class="w-16 h-16 rounded-full bg-green/10 flex items-center justify-center mx-auto mb-5">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1B9C63" stroke-width="3"><path d="m5 13 4 4L19 7"/></svg>
    </div>
    <h1 class="font-heading text-3xl tracking-wide mb-2">PASSWORD UPDATED</h1>
    <p class="text-sm text-muted mb-6">Your password has been changed successfully.</p>
    <a href="login.html" class="block w-full py-3 rounded-full bg-accent text-white font-semibold shadow-glow hover:brightness-110 transition">Go to Login</a>
  </div>
  -->

</body>
</html>
