<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hexlura — Select Event</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: { bg:'#FAF6F3', card:'#FFFFFF', border:'#F1E7E2', text:'#1A0E0C', muted:'#6B5D56', accent:'#E63950', orange:'#FF7A3D', amber:'#F5A623', yellow:'#F5C518', green:'#1B9C63', amberText:'#9C6900', yellowText:'#8C6A00' },
    fontFamily: { heading:['"Bebas Neue"','sans-serif'], sans:['"DM Sans"','sans-serif'], mono:['"JetBrains Mono"','monospace'] },
    boxShadow: { soft:'0 2px 12px rgba(60,20,10,0.05)', card:'0 6px 24px -4px rgba(60,20,10,0.08)', hover:'0 12px 36px -6px rgba(60,20,10,0.14)', glow:'0 10px 34px -6px rgba(230,57,80,0.4)' },
  } } }
</script>
<style>
  body { background: radial-gradient(1200px 500px at 90% -10%, rgba(255,122,61,0.10), transparent), radial-gradient(900px 400px at -10% 0%, rgba(230,57,80,0.07), transparent), #FAF6F3; }
</style>
</head>
<body class="font-sans text-text min-h-screen">
<header class="flex items-center justify-between px-5 py-4 max-w-md mx-auto"><p class="font-heading text-3xl text-accent tracking-wider">HEXLURA<sup class="text-[0.4em] align-super tracking-normal">®</sup></p><a href="#" class="text-sm font-semibold text-muted">Sign out</a></header>
<main class="px-5 pb-12 max-w-md mx-auto">
  <h1 class="font-heading text-4xl tracking-wide mt-2">SELECT EVENT</h1>
  <p class="text-sm text-muted mb-5">Choose the event you're working tonight.</p>
  <div class="flex flex-col gap-4">
    <div class="bg-card rounded-2xl border border-border shadow-card p-5">
      <p class="text-lg font-bold leading-snug">Neon Nights Festival</p>
      <p class="text-sm text-muted mt-1">Sat 17 Oct, 8:00 pm · The Warehouse, Manchester</p>
      <p class="inline-flex items-center gap-1.5 text-xs font-semibold text-green bg-green/10 rounded-full px-3 py-1 mt-3"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>Doors 7:30 pm — 11:00 pm</p>
      <a href="scanner.html" class="mt-4 w-full py-3.5 rounded-full bg-accent text-white font-semibold shadow-glow flex items-center justify-center gap-2">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></svg>Start scanning</a>
    </div>
    <div class="bg-card rounded-2xl border border-border shadow-card p-5">
      <p class="text-lg font-bold leading-snug">Warehouse Sessions</p>
      <p class="text-sm text-muted mt-1">Fri 6 Nov, 9:00 pm · Depot Mayfield, Manchester</p>
      
      <a href="scanner.html" class="mt-4 w-full py-3.5 rounded-full bg-accent text-white font-semibold shadow-glow flex items-center justify-center gap-2">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></svg>Start scanning</a>
    </div>
  </div>
  <!-- Empty state: "No upcoming events yet. Your organiser hasn't published any events." -->
</main>
</body>
</html>
